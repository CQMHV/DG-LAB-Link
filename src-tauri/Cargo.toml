[package]
name = "dg-lab-link-gui"
version = "0.1.0"
description = "可扩展的 DG-LAB 波形连接中枢"
authors = ["DG-LAB Link Contributors"]
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "dg_lab_link_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dg-lab-link-contracts = { path = "../crates/contracts" }
dg-lab-link-runtime = { path = "../crates/runtime", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
