[workspace]
members = ["crates/contracts", "crates/core", "crates/runtime", "crates/core-server", "crates/cli", "crates/mcp", "crates/plugin-sdk", "crates/plugin-runtime", "crates/builtin-plugins", "src-tauri"]
default-members = ["crates/core", "crates/runtime", "crates/core-server", "crates/cli", "crates/mcp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "process", "signal", "io-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.34"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
schemars = { version = "1", features = ["uuid1"] }
dg-lab-link-plugin-sdk = { path = "crates/plugin-sdk" }
dg-lab-link-plugin-runtime = { path = "crates/plugin-runtime" }
