[package]
name = "dg-lab-link-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
server = ["dep:dg-lab-link-core", "dep:axum"]

[dependencies]
dg-lab-link-contracts = { path = "../contracts" }
dg-lab-link-core = { path = "../core", optional = true }
axum = { version = "0.8.9", features = ["ws"], optional = true }
dirs = "6.0.0"
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
dg-lab-link-builtin-plugins = { path = "../builtin-plugins" }
dg-lab-link-core = { path = "../core" }
tempfile = "3.27.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio = { workspace = true, features = ["test-util"] }
