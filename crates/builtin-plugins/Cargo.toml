[package]
name = "dg-lab-link-builtin-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dg-lab-link-touch"
path = "src/bin/touch.rs"

[[bin]]
name = "dg-lab-link-audio"
path = "src/bin/audio.rs"

[dependencies]
dg-lab-link-plugin-sdk = { path = "../plugin-sdk" }
cpal = "0.18.2"
rustfft = "6.4.1"
symphonia = { version = "0.6.1", features = ["aac", "alac", "mp3", "isomp4"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
