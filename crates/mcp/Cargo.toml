[package]
name = "dg-lab-link-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
dg-lab-link-core = { path = "../core" }
dg-lab-link-runtime = { path = "../runtime" }
futures-util.workspace = true
rmcp = { version = "3.4.0", default-features = false, features = ["server", "transport-async-rw", "transport-streamable-http-server"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }

[dev-dependencies]
dg-lab-link-plugin-runtime = { path = "../plugin-runtime" }
tempfile = "3.27"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio-tungstenite.workspace = true
uuid.workspace = true
tower = { version = "0.5", features = ["util"] }
